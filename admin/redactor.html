<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Articles — Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #222;
            background: #f7f7f5;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 280px;
            flex-shrink: 0;

            padding: 20px;

            background: #fff;
            border-right: 1px solid #e5e5e5;

            display: flex;
            flex-direction: column;
        }

        .logo {
            margin-bottom: 20px;

            font-size: 20px;
            font-weight: 700;
        }

        .new-button {
            width: 100%;
            padding: 10px 14px;

            border: none;
            border-radius: 8px;

            background: #222;
            color: #fff;

            font-weight: 600;
        }

        .new-button:hover {
            background: #000;
        }

        .articles-title {
            margin-top: 25px;
            margin-bottom: 8px;

            color: #888;

            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .articles {
            overflow-y: auto;
        }

        .article {
            padding: 10px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article:hover {
            background: #f2f2f2;
        }

        .article.active {
            background: #e9e9e7;
            font-weight: 600;
        }

        .loading {
            color: #999;
            font-size: 14px;
        }

        .error {
            color: #c33;
            font-size: 14px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            min-width: 0;

            flex: 1;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        .toolbar {
            height: 60px;
            flex-shrink: 0;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #fff;
            border-bottom: 1px solid #e5e5e5;
        }

        .toolbar-left,
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar button {
            min-width: 34px;
            height: 34px;

            padding: 0 10px;

            border: 1px solid #ddd;
            border-radius: 7px;

            background: #fff;
        }

        .toolbar button:hover {
            background: #f3f3f3;
        }

        .save-button {
            padding: 0 15px !important;

            border-color: #222 !important;

            background: #222 !important;
            color: #fff;
        }

        .save-button:hover {
            background: #000 !important;
        }

        /* =========================
           EDITOR
        ========================= */

        .editor-wrapper {
            flex: 1;

            overflow-y: auto;

            padding: 50px 20px 100px;
        }

        .editor-container {
            width: 760px;
            max-width: 100%;

            margin: 0 auto;
        }

        #title {
            width: 100%;

            padding: 0;
            margin: 0 0 25px;

            border: none;
            outline: none;

            background: transparent;

            font-size: 44px;
            font-weight: 700;

            line-height: 1.15;
        }

        #title::placeholder {
            color: #aaa;
        }

        #editor {
            min-height: 500px;

            outline: none;

            font-size: 18px;
            line-height: 1.7;
        }

        #editor:empty::before {
            content: "Начните писать...";
            color: #aaa;
        }

        #editor h1 {
            font-size: 36px;
            line-height: 1.2;
        }

        #editor h2 {
            margin-top: 35px;

            font-size: 28px;
            line-height: 1.3;
        }

        #editor h3 {
            margin-top: 30px;

            font-size: 22px;
        }

        #editor blockquote {
            margin-left: 0;
            padding-left: 18px;

            border-left: 3px solid #222;

            color: #666;
        }

        #editor pre {
            padding: 16px;

            overflow-x: auto;

            border-radius: 8px;

            background: #222;
            color: #fff;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            line-height: 1.5;
        }

        #editor img {
            max-width: 100%;

            border-radius: 10px;
        }

        #editor a {
            color: #1769e0;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            margin-right: 10px;

            color: #888;

            font-size: 13px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, .35);
        }

        .modal.visible {
            display: flex;
        }

        .modal-content {
            width: 700px;
            max-width: calc(100% - 30px);
            max-height: 80vh;

            padding: 30px;

            overflow-y: auto;

            border-radius: 12px;

            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }

        .modal-content h1 {
            margin-top: 0;
        }

        .preview-content {
            line-height: 1.7;
            font-size: 18px;
        }

        .close-button {
            margin-top: 20px;

            padding: 9px 15px;

            border: none;
            border-radius: 7px;

            background: #222;
            color: white;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {
            .sidebar {
                width: 220px;
            }

            #title {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            My Articles
        </div>

        <button
            class="new-button"
            id="newArticleButton"
        >
            + Новая статья
        </button>

        <div class="articles-title">
            Статьи
        </div>

        <div
            class="articles"
            id="articles"
        >
            <div class="loading">
                Загрузка...
            </div>
        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <header class="toolbar">

            <div class="toolbar-left">

                <button
                    title="Жирный"
                    onclick="format('bold')"
                >
                    <b>B</b>
                </button>

                <button
                    title="Курсив"
                    onclick="format('italic')"
                >
                    <i>I</i>
                </button>

                <button
                    title="Заголовок"
                    onclick="format('formatBlock', 'h2')"
                >
                    H2
                </button>

                <button
                    title="Цитата"
                    onclick="format('formatBlock', 'blockquote')"
                >
                    ❝
                </button>

                <button
                    title="Маркированный список"
                    onclick="format('insertUnorderedList')"
                >
                    • List
                </button>

                <button
                    title="Нумерованный список"
                    onclick="format('insertOrderedList')"
                >
                    1. List
                </button>

                <button
                    title="Код"
                    onclick="insertCode()"
                >
                    &lt;/&gt;
                </button>

            </div>


            <div class="toolbar-right">

                <span
                    class="status"
                    id="status"
                >
                    Готово
                </span>

                <button
                    onclick="preview()"
                >
                    Preview
                </button>

                <button
                    class="save-button"
                    onclick="saveDraft()"
                >
                    Сохранить
                </button>

            </div>

        </header>


        <!-- =========================
             EDITOR
        ========================== -->

        <div class="editor-wrapper">

            <div class="editor-container">

                <input
                    id="title"
                    type="text"
                    placeholder="Название статьи"
                    autocomplete="off"
                >

                <div
                    id="editor"
                    contenteditable="true"
                    spellcheck="true"
                ></div>

            </div>

        </div>

    </main>

</div>


<!-- =========================
     PREVIEW MODAL
========================== -->

<div
    class="modal"
    id="previewModal"
>

    <div class="modal-content">

        <h1 id="previewTitle"></h1>

        <div
            class="preview-content"
            id="previewContent"
        ></div>

        <button
            class="close-button"
            onclick="closePreview()"
        >
            Закрыть
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const GITHUB = {
    owner: "Olmy760",
    repository: "My-articles",
    branch: "main"
};


/* =========================================================
   STATE
========================================================= */

let articles = [];

let currentArticle = null;


/* =========================================================
   DOM
========================================================= */

const titleInput =
    document.getElementById("title");

const editor =
    document.getElementById("editor");

const articlesContainer =
    document.getElementById("articles");

const statusElement =
    document.getElementById("status");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {
    statusElement.textContent = text;
}


/* =========================================================
   GITHUB
========================================================= */

async function getArticles() {

    const url =
        `https://api.github.com/repos/` +
        `${GITHUB.owner}/` +
        `${GITHUB.repository}/contents/_posts`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `GitHub error: ${response.status}`
        );
    }

    return response.json();
}


async function getArticle(path) {

    const url =
        `https://raw.githubusercontent.com/` +
        `${GITHUB.owner}/` +
        `${GITHUB.repository}/` +
        `${GITHUB.branch}/` +
        `${path}`;

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error(
            `Article error: ${response.status}`
        );
    }

    return response.text();
}


/* =========================================================
   LOAD ARTICLES
========================================================= */

async function loadArticles() {

    setStatus("Загрузка...");

    try {

        const files =
            await getArticles();

        articles =
            files.filter(file =>
                file.name.endsWith(".md")
            );

        renderArticles();

        setStatus(
            `${articles.length} статей`
        );

    } catch (error) {

        console.error(error);

        articlesContainer.innerHTML = `
            <div class="error">
                Не удалось загрузить статьи
            </div>
        `;

        setStatus("Ошибка");

    }
}


/* =========================================================
   RENDER ARTICLE LIST
========================================================= */

function renderArticles() {

    articlesContainer.innerHTML = "";

    if (articles.length === 0) {

        articlesContainer.innerHTML = `
            <div class="loading">
                Статей пока нет
            </div>
        `;

        return;
    }

    for (const article of articles) {

        const element =
            document.createElement("div");

        element.className = "article";

        element.textContent =
            article.name
                .replace(/^\d{4}-\d{2}-\d{2}-/, "")
                .replace(/\.md$/, "");

        element.title = article.name;

        element.onclick = () =>
            openArticle(article, element);

        articlesContainer.appendChild(element);
    }
}


/* =========================================================
   OPEN ARTICLE
========================================================= */

async function openArticle(article, element) {

    setStatus("Загрузка...");

    try {

        const markdown =
            await getArticle(article.path);

        currentArticle = article;

        titleInput.value =
            extractTitle(markdown, article.name);

        editor.innerHTML =
            markdownToHtml(
                removeFrontMatter(markdown)
            );

        document
            .querySelectorAll(".article")
            .forEach(item =>
                item.classList.remove("active")
            );

        element.classList.add("active");

        setStatus("Готово");

    } catch (error) {

        console.error(error);

        setStatus("Ошибка");

        alert(
            "Не удалось открыть статью."
        );
    }
}


/* =========================================================
   MARKDOWN
========================================================= */

function removeFrontMatter(markdown) {

    return markdown.replace(
        /^---[\s\S]*?---\s*/,
        ""
    );
}


function extractTitle(markdown, fallback) {

    const match =
        markdown.match(
            /^title:\s*["']?(.*?)["']?\s*$/m
        );

    if (match) {
        return match[1];
    }

    return fallback
        .replace(/^\d{4}-\d{2}-\d{2}-/, "")
        .replace(/\.md$/, "");
}


/*
    Очень простой Markdown → HTML.

    Позже заменим это на Tiptap.
*/

function markdownToHtml(markdown) {

    let html =
        escapeHtml(markdown);

    html = html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );

    html = html.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );

    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    html = html.replace(
        /^> (.*)$/gm,
        "<blockquote>$1</blockquote>"
    );

    html = html.replace(
        /^```([\s\S]*?)```/g,
        "<pre>$1</pre>"
    );

    html = html.replace(
        /\n\n/g,
        "</p><p>"
    );

    return "<p>" + html + "</p>";
}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   EDITOR
========================================================= */

function format(command, value = null) {

    document.execCommand(
        command,
        false,
        value
    );

    editor.focus();
}


function insertCode() {

    const code =
        document.createElement("pre");

    code.textContent =
        "Введите код...";

    editor.appendChild(code);

    editor.focus();
}


/* =========================================================
   NEW ARTICLE
========================================================= */

document
    .getElementById("newArticleButton")
    .addEventListener(
        "click",
        newArticle
    );


function newArticle() {

    currentArticle = null;

    titleInput.value = "";

    editor.innerHTML = "";

    document
        .querySelectorAll(".article")
        .forEach(item =>
            item.classList.remove("active")
        );

    titleInput.focus();

    setStatus("Новая статья");
}


/* =========================================================
   LOCAL SAVE
========================================================= */

function saveDraft() {

    const data = {

        title:
            titleInput.value.trim(),

        content:
            editor.innerHTML,

        article:
            currentArticle
                ? currentArticle.path
                : null

    };

    localStorage.setItem(
        "my-articles-draft",
        JSON.stringify(data)
    );

    setStatus("Сохранено локально");

    setTimeout(
        () => setStatus("Готово"),
        2000
    );
}


/* =========================================================
   LOAD LOCAL DRAFT
========================================================= */

function loadDraft() {

    const raw =
        localStorage.getItem(
            "my-articles-draft"
        );

    if (!raw) {
        return;
    }

    try {

        const data =
            JSON.parse(raw);

        if (
            !data.title &&
            !data.content
        ) {
            return;
        }

        const restore =
            confirm(
                "Найден сохранённый черновик. " +
                "Восстановить его?"
            );

        if (!restore) {
            return;
        }

        titleInput.value =
            data.title || "";

        editor.innerHTML =
            data.content || "";

        setStatus("Черновик восстановлен");

    } catch (error) {

        console.error(error);

    }
}


/* =========================================================
   PREVIEW
========================================================= */

function preview() {

    document
        .getElementById("previewTitle")
        .textContent =
        titleInput.value ||
        "Без названия";

    document
        .getElementById("previewContent")
        .innerHTML =
        editor.innerHTML;

    document
        .getElementById("previewModal")
        .classList.add("visible");
}


function closePreview() {

    document
        .getElementById("previewModal")
        .classList.remove("visible");
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveDraft();
        }

    }
);


/* =========================================================
   START
========================================================= */

loadArticles();

loadDraft();

</script>

</body>
</html>
