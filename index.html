<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой телетайп-блог</title>
    <style>
        /* 🌑 Базовый ретро-стиль */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #33ff33;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            font-size: 18px;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* 📟 Эмуляция ЭЛТ-монитора */
        .terminal {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 25px;
            background: #0d0d0d;
            border: 2px solid #33ff33;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(51, 255, 51, 0.2), inset 0 0 30px rgba(51, 255, 51, 0.05);
            position: relative;
        }

        /* Эффект мерцания (очень лёгкий) */
        .terminal::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.05) 0px,
                    rgba(0, 0, 0, 0.05) 2px,
                    transparent 2px,
                    transparent 6px);
            pointer-events: none;
            border-radius: 8px;
        }

        /* 🔤 Заголовок с мигающим курсором */
        .header {
            border-bottom: 1px solid #33ff33;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .site-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #33ff33;
        }

        .site-title a {
            color: #33ff33;
            text-decoration: none;
        }
        .site-title a:hover {
            text-decoration: underline;
        }

        .cursor-blink {
            display: inline-block;
            width: 12px;
            height: 28px;
            background: #33ff33;
            margin-left: 5px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .nav-links a {
            color: #33ff33;
            text-decoration: none;
            margin-left: 20px;
            padding: 5px 10px;
            border: 1px solid #33ff33;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: #33ff33;
            color: #0a0a0a;
            box-shadow: 0 0 20px #33ff33;
        }

        /* 📰 Список статей */
        .articles-list {
            list-style: none;
            margin: 20px 0;
        }

        .articles-list li {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-left: 3px solid transparent;
            transition: 0.2s;
        }

        .articles-list li:hover {
            border-left-color: #33ff33;
            background: rgba(51, 255, 51, 0.05);
        }

        .articles-list a {
            color: #33ff33;
            text-decoration: none;
            font-size: 20px;
            display: block;
        }

        .articles-list a:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px #33ff33;
        }

        .article-date {
            font-size: 14px;
            color: #88ff88;
            opacity: 0.7;
            margin-left: 15px;
        }

        .article-description {
            font-size: 15px;
            color: #88ff88;
            opacity: 0.6;
            margin-left: 15px;
        }

        /* 📄 Страница отдельной статьи */
        .article-content {
            margin: 20px 0;
        }

        .article-content h1 {
            font-size: 32px;
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 10px;
        }

        .article-content h2, .article-content h3 {
            margin-top: 25px;
            color: #88ff88;
        }

        .article-content p {
            margin: 15px 0;
        }

        .article-content ul, .article-content ol {
            margin: 10px 0 10px 30px;
        }

        .article-content blockquote {
            border-left: 4px solid #33ff33;
            padding-left: 20px;
            opacity: 0.8;
            font-style: italic;
        }

        .article-content code {
            background: #1a1a1a;
            padding: 2px 8px;
            border: 1px solid #33ff33;
            font-size: 0.9em;
        }

        .article-content pre {
            background: #1a1a1a;
            padding: 15px;
            border: 1px solid #33ff33;
            overflow-x: auto;
        }

        .article-content img {
            max-width: 100%;
            border: 1px solid #33ff33;
            padding: 3px;
            background: #0a0a0a;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #33ff33;
            text-decoration: none;
            border: 1px solid #33ff33;
            padding: 8px 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #33ff33;
            color: #0a0a0a;
            box-shadow: 0 0 20px #33ff33;
        }

        /* 🖥️ Сообщение "Нет статей" */
        .empty-message {
            opacity: 0.6;
            font-style: italic;
            padding: 20px;
            text-align: center;
            border: 1px dashed #33ff33;
        }

        /* ⚙️ Адаптивность */
        @media (max-width: 700px) {
            body { font-size: 16px; padding: 10px; }
            .terminal { padding: 15px; }
            .header { flex-direction: column; align-items: flex-start; }
            .nav-links a { margin-left: 0; margin-right: 10px; display: inline-block; margin-top: 10px; }
            .site-title { font-size: 22px; }
            .articles-list a { font-size: 17px; }
            .article-date, .article-description { display: block; margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="terminal">

    <!-- ШАПКА -->
    <header class="header">
        <div class="site-title">
            <a href="/My-articles/">~/my_blog</a>
            <span class="cursor-blink"></span>
        </div>
        <div class="nav-links">
            <a href="/My-articles/admin">📝 /admin</a>
            <a href="https://github.com/Olmy760/My-articles" target="_blank">🐙 src</a>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main id="content">
        <!-- Сюда будет загружаться список статей или содержимое статьи -->
    </main>

</div>

<script>
    // ═══════════════════════════════════════════════════════
    //  🚀 МАРШРУТИЗАТОР И ЗАГРУЗЧИК СТАТЕЙ
    // ═══════════════════════════════════════════════════════

    const contentEl = document.getElementById('content');

    // 📚 Функция загрузки списка статей
    async function loadArticlesList() {
        try {
            // Пытаемся получить список всех .md файлов из папки _posts
            const response = await fetch('https://api.github.com/repos/Olmy760/My-articles/contents/_posts');
            
            if (!response.ok) {
                throw new Error('Не удалось загрузить список статей');
            }

            const files = await response.json();
            
            // Фильтруем только .md файлы
            const mdFiles = files.filter(f => f.name.endsWith('.md') && f.type === 'file');
            
            if (mdFiles.length === 0) {
                contentEl.innerHTML = `
                    <div class="empty-message">
                        ⚡ Ещё нет статей. <a href="/My-articles/admin" style="color:#33ff33;">Напиши первую!</a>
                    </div>
                `;
                return;
            }

            // Сортируем по дате (новые сверху)
            mdFiles.sort((a, b) => {
                // Парсим дату из имени файла (YYYY-MM-DD)
                const dateA = a.name.slice(0, 10);
                const dateB = b.name.slice(0, 10);
                return dateB.localeCompare(dateA);
            });

            let html = '<ul class="articles-list">';
            
            for (const file of mdFiles) {
                const name = file.name;
                const date = name.slice(0, 10);
                // Читаем содержимое .md файла, чтобы вытащить заголовок
                const contentResponse = await fetch(file.download_url);
                const mdContent = await contentResponse.text();
                
                // Ищем заголовок (первая строка после ---)
                const titleMatch = mdContent.match(/title:\s*"([^"]+)"/);
                const title = titleMatch ? titleMatch[1] : name.slice(11, -3).replace(/-/g, ' ');
                
                // Ищем описание
                const descMatch = mdContent.match(/description:\s*"([^"]+)"/);
                const description = descMatch ? descMatch[1] : '';
                
                // Ссылка на статью
                const slug = name.slice(11, -3); // убираем дату и .md
                
                html += `
                    <li>
                        <a href="/My-articles/?article=${slug}">
                            ${title}
                            <span class="article-date">[${date}]</span>
                            ${description ? `<span class="article-description">— ${description}</span>` : ''}
                        </a>
                    </li>
                `;
            }
            
            html += '</ul>';
            contentEl.innerHTML = html;

        } catch (error) {
            console.error('Ошибка загрузки статей:', error);
            contentEl.innerHTML = `
                <div class="empty-message">
                    ⚠️ Ошибка загрузки статей. Проверь подключение к интернету.
                </div>
            `;
        }
    }

    // 📄 Функция загрузки и отображения одной статьи
    async function loadArticle(slug) {
        try {
            // Ищем файл в _posts с нужным slug
            const response = await fetch('https://api.github.com/repos/Olmy760/My-articles/contents/_posts');
            const files = await response.json();
            
            const mdFiles = files.filter(f => f.name.endsWith('.md') && f.type === 'file');
            // Ищем файл, где slug совпадает (убираем дату и расширение)
            let targetFile = null;
            for (const file of mdFiles) {
                const fileSlug = file.name.slice(11, -3); // убираем YYYY-MM-DD- и .md
                if (fileSlug === slug) {
                    targetFile = file;
                    break;
                }
            }
            
            if (!targetFile) {
                contentEl.innerHTML = `<div class="empty-message">❌ Статья не найдена.</div>`;
                return;
            }

            // Загружаем содержимое
            const mdResponse = await fetch(targetFile.download_url);
            const mdContent = await mdResponse.text();

            // 🪄 Парсим frontmatter (--- ... ---) и превращаем Markdown в HTML
            const { html, title } = parseMarkdown(mdContent);

            contentEl.innerHTML = `
                <div class="article-content">
                    <h1>${title}</h1>
                    <div>${html}</div>
                    <a href="/My-articles/" class="back-link">← назад к списку</a>
                </div>
            `;

        } catch (error) {
            console.error('Ошибка загрузки статьи:', error);
            contentEl.innerHTML = `<div class="empty-message">⚠️ Не удалось загрузить статью.</div>`;
        }
    }

    // 🧩 Простой парсер Markdown (базовый, но достаточный)
    function parseMarkdown(md) {
        // Вытаскиваем frontmatter
        let title = 'Статья';
        let body = md;
        
        const frontMatterMatch = md.match(/^---\n([\s\S]*?)\n---\n/);
        if (frontMatterMatch) {
            const frontMatter = frontMatterMatch[1];
            body = md.slice(frontMatterMatch[0].length);
            const titleMatch = frontMatter.match(/title:\s*"([^"]+)"/);
            if (titleMatch) title = titleMatch[1];
        }

        // Конвертируем Markdown -> HTML (базовые элементы)
        let html = body
            // Заголовки
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            // Жирный и курсив
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            // Код
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            // Списки
            .replace(/^- (.*$)/gim, '<li>$1</li>')
            .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
            .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
            .replace(/(<li>.*<\/li>\n?)+/g, function(match) {
                if (!match.includes('<ul>')) return '<ol>' + match + '</ol>';
                return match;
            })
            // Цитаты
            .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
            // Ссылки
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#33ff33;text-decoration:underline;">$1</a>')
            // Изображения
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border:1px solid #33ff33;padding:3px;">')
            // Параграфы (переносы строк)
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');

        // Оборачиваем в параграфы, если не начали с заголовка
        if (!html.startsWith('<h1>') && !html.startsWith('<h2>') && !html.startsWith('<h3>') && !html.startsWith('<ul>') && !html.startsWith('<ol>') && !html.startsWith('<blockquote>')) {
            html = '<p>' + html + '</p>';
        }

        return { html, title };
    }

    // ═══════════════════════════════════════════════════════
    //  🧭 ОБРАБОТКА НАВИГАЦИИ
    // ═══════════════════════════════════════════════════════

    function navigate() {
        const params = new URLSearchParams(window.location.search);
        const articleSlug = params.get('article');

        if (articleSlug) {
            loadArticle(articleSlug);
        } else {
            loadArticlesList();
        }
    }

    // Слушаем изменения в истории (для кнопок "назад")
    window.addEventListener('popstate', navigate);

    // При загрузке страницы — определяем, что показывать
    navigate();

    // ⚠️ Ловим ошибки, если GitHub API не отвечает
    console.log('🖥️ Телетайп-блог загружен. Приятного чтения!');
</script>

</body>
</html>
